<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Bank</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <div class="bg-animate">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="main-container" id="main-container">

        <div class="form-container sign-up-container">
            <form action="#">
                <h2>Create Account</h2>
                <p class="subtitle">Join Aura Bank today</p>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Full Name" />
                </div>
                <div class="error-message"></div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email" />
                </div>
                <div class="error-message"></div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" />
                </div>
                <div class="error-message"></div>
                <button type="submit" class="action-btn">Sign Up</button>
                <div class="social-login">
                    <button type="button" class="social-btn"><i class="fab fa-google"></i> Google</button>
                    <button type="button" class="social-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
                </div>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form action="#">
                <h2>SIGN IN</h2>
                <p class="subtitle">Sign in with email address</p>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="yourname@gmail.com" />
                </div>
                <div class="error-message"></div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" />
                    <i class="far fa-eye toggle-eye"></i>
                </div>
                <div class="error-message"></div>
                <a href="forgotpassword.html" class="forgot">Forgot password?</a>
                <button type="submit" class="action-btn">Sign in</button>

                <div class="social-login">
                    <button type="button" class="social-btn"><i class="fab fa-google"></i> Google</button>
                    <button type="button" class="social-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
                </div>
                <p class="footer-note">By signing in you agree to our Terms and Conditions</p>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <div class="back-nav" id="backNav"><i class="fas fa-chevron-left"></i><img
                            src="components/logonamew.png" alt="Logo" class="logo-img"> </div>
                    <div class="brand-content">
                        <div class="logo-placeholder">
                            <img src="components/logo.png" alt="Logo" class="logo-img">
                        </div>
                        <h1>Welcome Back!</h1>
                        <p>To keep connected with us please login with your personal information</p>
                        <button class="ghost-btn" id="signIn">Sign In</button>
                    </div>
                </div>
                <div class="overlay-panel overlay-right">
                    <div class="back-nav" id="backNav2"><i class="fas fa-chevron-left"></i><img
                            src="components/logonamew.png" alt="Logo" class="logo-img"> </div>
                    <div class="brand-content">
                        <div class="logo-placeholder">
                            <img src="components/logo.png" alt="Logo" class="logo-img">
                        </div>
                        <h1>Hello, Customer!</h1>
                        <p>Start your journey with us</p>
                        <button class="ghost-btn" id="signUp">Sign Up</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
