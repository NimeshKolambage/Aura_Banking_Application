<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Soft blur filters -->
    <filter id="blur1">
      <feGaussianBlur in="SourceGraphic" stdDeviation="100" />
    </filter>
    
    <filter id="blur2">
      <feGaussianBlur in="SourceGraphic" stdDeviation="80" />
    </filter>
    
    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b3e5e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8f7f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    
    <!-- Teal mesh gradient -->
    <radialGradient id="meshTeal1" cx="15%" cy="30%">
      <stop offset="0%" style="stop-color:#5dc4b5;stop-opacity:0.8" />
      <stop offset="60%" style="stop-color:#a8ddd6;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Mint gradient -->
    <radialGradient id="meshMint" cx="85%" cy="20%">
      <stop offset="0%" style="stop-color:#7dd9cc;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#c0ebe4;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Center light gradient -->
    <radialGradient id="centerLight" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8f7f5;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)" />
  
  <!-- Left teal mesh -->
  <circle cx="200" cy="400" r="600" fill="url(#meshTeal1)" filter="url(#blur1)" />
  
  <!-- Top right mint -->
  <circle cx="1700" cy="200" r="500" fill="url(#meshMint)" filter="url(#blur2)" />
  
  <!-- Bottom left subtle -->
  <circle cx="400" cy="900" r="400" fill="#a8ddd6" opacity="0.3" filter="url(#blur2)" />
  
  <!-- Center enhancement -->
  <circle cx="960" cy="540" r="800" fill="url(#centerLight)" filter="url(#blur1)" />
  
  <!-- Bottom right subtle accent -->
  <circle cx="1600" cy="950" r="350" fill="#7dd9cc" opacity="0.25" filter="url(#blur2)" />
  
  <!-- Top left subtle wave -->
  <ellipse cx="300" cy="100" rx="500" ry="300" fill="#c0ebe4" opacity="0.4" filter="url(#blur2)" />
</svg>