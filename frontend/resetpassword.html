<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Aura Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .reset-icon {
            width: 80px;
            height: 80px;
            background: #e3f2fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: #667eea;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        form {
            margin-top: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group input:valid {
            border-color: #4caf50;
        }

        .input-group input:invalid {
            border-color: #f44336;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 40px;
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .strength-meter {
            margin-top: 8px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            background: #f44336;
            transition: all 0.3s ease;
        }

        .strength-bar.weak {
            width: 33%;
            background: #ff9800;
        }

        .strength-bar.medium {
            width: 66%;
            background: #ffc107;
        }

        .strength-bar.strong {
            width: 100%;
            background: #4caf50;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 4px;
            color: #666;
        }

        .password-requirements {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .password-requirements.show {
            display: block;
        }

        .requirements-list {
            list-style: none;
            font-size: 13px;
        }

        .requirements-list li {
            padding: 4px 0;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .requirements-list li.met {
            color: #4caf50;
        }

        .requirements-list i {
            width: 16px;
            text-align: center;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-reset {
            background: #667eea;
            color: white;
        }

        .btn-reset:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-reset:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            background: #e0e0e0;
            color: #333;
        }

        .btn-back:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }

        .spinner {
            display: inline-block;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #764ba2;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <a href="login.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Login
        </a>

        <div class="reset-icon">
            <i class="fa-solid fa-key"></i>
        </div>

        <h1>Reset Your Password</h1>
        <p class="subtitle">Enter your new password to regain access to your account</p>

        <div class="status-message" id="statusMessage"></div>

        <form id="resetForm">
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                <button type="button" class="password-toggle" id="togglePassword1" title="Show/Hide Password">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="password-requirements" id="requirements">
                <ul class="requirements-list">
                    <li id="req-length" data-requirement="length">
                        <i class="fa-solid fa-circle"></i>
                        At least 8 characters
                    </li>
                    <li id="req-uppercase" data-requirement="uppercase">
                        <i class="fa-solid fa-circle"></i>
                        One uppercase letter
                    </li>
                    <li id="req-lowercase" data-requirement="lowercase">
                        <i class="fa-solid fa-circle"></i>
                        One lowercase letter
                    </li>
                    <li id="req-number" data-requirement="number">
                        <i class="fa-solid fa-circle"></i>
                        One number
                    </li>
                    <li id="req-special" data-requirement="special">
                        <i class="fa-solid fa-circle"></i>
                        One special character (!@#$%^&*)
                    </li>
                </ul>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password"
                    required>
                <button type="button" class="password-toggle" id="togglePassword2" title="Show/Hide Password">
                    <i class="fa-solid fa-eye-slash"></i>
                </button>
            </div>

            <div class="form-group">
                <button type="button" class="btn-back" onclick="window.location.href='login.html'">Cancel</button>
                <button type="submit" class="btn-reset" id="resetBtn">Reset Password</button>
            </div>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

        const SUPABASE_URL = 'https://zndmjjeirwbmsptgrwhb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_edTDcROSO8DdrMfO6WsGAg_Uo9-J1OY';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetForm = document.getElementById('resetForm');
        const resetBtn = document.getElementById('resetBtn');
        const statusMessage = document.getElementById('statusMessage');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const requirementsDiv = document.getElementById('requirements');
        const toggleBtns = document.querySelectorAll('.password-toggle');

        // Password visibility toggle
        toggleBtns.forEach((btn, index) => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                const input = index === 0 ? newPasswordInput : confirmPasswordInput;
                const icon = this.querySelector('i');
                const isPassword = input.getAttribute('type') === 'password';

                input.setAttribute('type', isPassword ? 'text' : 'password');
                icon.classList.toggle('fa-eye');
                icon.classList.toggle('fa-eye-slash');
            });
        });

        // Compare Password
        function comparePasswords() {
            const match = newPasswordInput.value === confirmPasswordInput.value && newPasswordInput.value !== '';
            if (match) {
                confirmPasswordInput.style.borderColor = '#4caf50';
            } else if (confirmPasswordInput.value !== '') {
                confirmPasswordInput.style.borderColor = '#f44336';
            }
            return match;
        }

        // Validate Password Strength
        function validatePassword(password) {
            requirementsDiv.classList.add('show');
            const checks = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*]/.test(password)
            };

            let score = 0;
            for (const [key, value] of Object.entries(checks)) {
                const element = document.getElementById(`req-${key}`);
                if (value) {
                    element.classList.add('met');
                    score++;
                } else {
                    element.classList.remove('met');
                }
            }

            // Update strength meter
            strengthBar.className = 'strength-bar';
            if (password.length === 0) {
                strengthText.textContent = '';
            } else if (score <= 2) {
                strengthBar.classList.add('weak');
                strengthText.textContent = 'Weak password';
            } else if (score <= 3) {
                strengthBar.classList.add('medium');
                strengthText.textContent = 'Medium strength';
            } else {
                strengthBar.classList.add('strong');
                strengthText.textContent = 'Strong password';
            }

            return Object.values(checks).every(v => v);
        }

        // Event listeners
        newPasswordInput.addEventListener('input', function () {
            validatePassword(this.value);
            comparePasswords();
        });

        confirmPasswordInput.addEventListener('input', comparePasswords);

        // Form submission
        resetForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validation
            if (!validatePassword(newPassword)) {
                showStatus('Password does not meet requirements', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showStatus('Passwords do not match', 'error');
                return;
            }

            // Disable button
            resetBtn.disabled = true;
            const originalText = resetBtn.innerHTML;
            resetBtn.innerHTML = '<span class="spinner"></span>Resetting...';

            try {
                // Update password using Supabase
                const { data, error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    showStatus('Error: ' + error.message, 'error');
                } else {
                    showStatus('Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            } catch (error) {
                showStatus('Unexpected error: ' + error.message, 'error');
            } finally {
                resetBtn.disabled = false;
                resetBtn.innerHTML = originalText;
            }
        });

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;

            // Auto-hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        }

        // Initialize password reset from email link
        async function initializePasswordReset() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    // Look for access_token in URL hash
                    const hash = window.location.hash.substr(1);
                    const params = new URLSearchParams(hash);
                    const accessToken = params.get('access_token');
                    const type = params.get('type');

                    if (accessToken && type === 'recovery') {
                        // Token is valid, user can now reset password
                        console.log('Password reset token verified');
                    }
                }
            } catch (error) {
                console.error('Initialization error:', error);
            }
        }

        initializePasswordReset();
    </script>
</body>

</html>
