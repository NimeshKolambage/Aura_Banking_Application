<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Aura Bank</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>

<body>
    <div class="split-screen-container">
        <div class="design-panel">
            <a href="mainui.html" class="back-link">
                <i class="fa-solid fa-angle-left" style="color: #ffffff;"></i>
            </a>
            <a href="mainui.html" class="back-link-logo">
                <img data-aos="fade-down-right" src="components/loginlogoname.png" class="logoname"
                    alt="Aura Bank Logo">
            </a>

            <div class="logo-container">
                <a href="#" class="logo">
                    <img src="components/logo.png" alt="Aura Bank Logo">
                </a>
            </div>
        </div>
        <div class="form-panel">
            <div class="form-wrapper">
                <h2>SIGN IN</h2>
                <p class="subtitle">Sign in with email address</p>

                <form action="#" method="POST">
                    <div class="input-group">
                        <span class="icon"><i class="fa-solid fa-envelope fa-xs"></i></span>
                        <input type="email" id="email" name="email" placeholder="yourname@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <span class="icon"><i class="fa-solid fa-lock fa-xs"></i></span>
                        <input type="password" id="password" name="password" placeholder="Password" required>
                        <button type="button" class="password-toggle" id="togglePassword">
                            <i class="fa-solid fa-eye-slash fa-sm"></i>
                        </button>
                    </div>

                    <div class="forgot-password">
                        <a href="signup.html#forgot">Forgot password?</a>
                    </div>

                    <button type="submit" class="sign-in-button">Sign in</button>
                </form>

                <p class="terms-link">
                    By signing in you agree to our <a href="#">Terms and Conditions</a>
                </p>

                <p class="signup-link">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm"></script>

    <script type="module">
        // Import Supabase
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/+esm';

        // Initialize Supabase
        const SUPABASE_URL = 'https://zndmjjeirwbmsptgrwhb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_edTDcROSO8DdrMfO6WsGAg_Uo9-J1OY';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Initialize AOS
        AOS.init();

        // Password toggle functionality
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const toggleIcon = this.querySelector('i');

            passwordInput.classList.add('password-field');

            const isPassword = passwordInput.getAttribute('type') === 'password';
            const newType = isPassword ? 'text' : 'password';
            passwordInput.setAttribute('type', newType);

            if (isPassword) {
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        });

        // Form submission - Login with Supabase
        document.querySelector('form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const signInButton = document.querySelector('.sign-in-button');
            const originalText = signInButton.textContent;

            // Validation
            if (!email || !password) {
                alert('Please fill in all fields');
                return;
            }

            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address');
                return;
            }

            // Password validation
            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }

            // Disable button and show loading state
            signInButton.disabled = true;
            signInButton.textContent = "Signing in...";

            try {
                // Sign in with Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    console.error('Login Error:', error.message);
                    alert('Login failed: ' + error.message);
                    signInButton.disabled = false;
                    signInButton.textContent = originalText;
                    return;
                }

                if (data.user) {
                    console.log('Login successful:', data.user);

                    // Store user info in sessionStorage for access across pages
                    sessionStorage.setItem('user_id', data.user.id);
                    sessionStorage.setItem('user_email', data.user.email);
                    sessionStorage.setItem('access_token', data.session.access_token);

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                }
            } catch (error) {
                console.error('Unexpected error:', error);
                alert('An unexpected error occurred: ' + error.message);
                signInButton.disabled = false;
                signInButton.textContent = originalText;
            }
        });

        // Check if user is already logged in
        async function checkAuthStatus() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // User is already logged in, redirect to dashboard
                window.location.href = 'dashboard.html';
            }
        }

        // Check auth status on page load
        checkAuthStatus();
    </script>
</body>

</html>
